<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Club Task Manager</title>
  <meta name="description" content="Shared weekly task manager for your club." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ── LOADING OVERLAY ── -->
  <div id="initial-loader" class="loader-overlay">
    <div class="spinner"></div>
  </div>

  <!-- ── LOGIN SCREEN ── -->
  <div id="login-screen" class="view-screen hidden">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        </div>
        <h1 id="login-club-name">Club Task Manager</h1>
      </div>
      <form id="login-form">
        <div class="input-group">
          <div class="password-wrapper">
            <input type="password" id="password-input" placeholder="Enter club password" autocomplete="current-password" />
            <button type="button" id="toggle-pw" class="btn-icon-soft" aria-label="Show password">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <div id="login-error" class="error-msg hidden">Incorrect password. Try again.</div>
        <button type="submit" class="btn btn-primary btn-full pill-btn" id="login-btn">
          <span>Unlock</span>
        </button>
      </form>
    </div>
  </div>

  <!-- ── MAIN APP ── -->
  <div id="app" class="app hidden">
    <!-- Main content -->
    <main class="main-content" id="main-content">
      
      <!-- HEADER -->
      <header class="app-header">
        <div class="header-top">
          <div class="header-titles">
            <h1 class="view-title" id="main-view-title">This Week</h1>
            <p class="view-subtitle" id="main-view-subtitle">Loading...</p>
          </div>
          <div class="header-actions">
            <!-- Progress Ring -->
            <div class="progress-ring-container" id="header-progress" style="display: none;">
              <svg class="progress-ring" width="48" height="48">
                <circle class="progress-ring__circle-bg" stroke="rgba(0,0,0,0.05)" stroke-width="4" fill="transparent" r="20" cx="24" cy="24"/>
                <circle class="progress-ring__circle" stroke="var(--accent)" stroke-width="4" fill="transparent" r="20" cx="24" cy="24" stroke-dasharray="125.6" stroke-dashoffset="125.6"/>
              </svg>
              <span class="progress-text" id="progress-text">0%</span>
            </div>
            <button class="btn-icon-soft" id="nav-settings-btn" aria-label="Settings">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
          </div>
        </div>

        <!-- WEEK STRIP -->
        <div class="week-strip" id="week-strip">
          <!-- Populated by JS -->
        </div>

        <!-- VIEW TOGGLES -->
        <div class="view-toggles">
          <button class="view-tab active" data-view="dashboard">This Week</button>
          <button class="view-tab" data-view="nextweek">Next Week</button>
          <button class="view-tab" data-view="archive">Archive</button>
        </div>
        
        <div class="filter-toggles hidden" id="filter-container">
            <span class="group-label" style="margin-bottom:0; margin-right:8px; display:inline-block;">Filter by Assigned To:</span>
            <select id="assignee-filter" class="styled-select" style="padding: 6px 12px; font-size: 0.85rem; width: auto; min-width: 140px; display:inline-block;">
              <option value="all">Everyone</option>
            </select>
        </div>
      </header>

      <!-- ── VIEWS CONTAINER ── -->
      <div class="views-container">
        
        <!-- DASHBOARD & NEXT WEEK (Use the same container logic) -->
        <section id="view-tasks" class="view active">
          <div id="tasks-content" class="task-groups">
            <!-- Skeleton Loader -->
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </section>

        <!-- ARCHIVE VIEW -->
        <section id="view-archive" class="view">
          <div class="archive-header" style="margin-bottom: 20px;">
            <select id="archive-week-picker" class="styled-select" style="font-size: 1rem; font-weight: 600; padding: 12px; border-radius: var(--radius-md);">
              <option value="" disabled selected>Select a past week...</option>
            </select>
          </div>
          
          <div id="archive-week-strip" class="week-strip hidden" style="margin-bottom: 20px;">
            <!-- Populated by JS -->
          </div>

          <div id="archive-tasks-container" class="task-groups" style="transition: opacity 0.3s ease;">
            <div style="text-align:center; padding: 40px; color: var(--text-tertiary);">
              Select a week to view archived tasks.
            </div>
          </div>
        </section>

        <!-- SETTINGS VIEW -->
        <section id="view-settings" class="view">
          <div class="settings-grid">
            <div class="settings-card">
              <h2>Club Identity</h2>
              <div class="input-group">
                <label>Club Name</label>
                <input type="text" id="setting-club-name" placeholder="e.g. Engineering Society" />
              </div>
              <button class="btn btn-primary pill-btn" id="save-general-settings">Save Changes</button>
              <div id="settings-general-msg" class="success-msg hidden">Saved!</div>
            </div>
            <div class="settings-card">
              <h2>Change Password</h2>
              <div class="input-group">
                <input type="password" id="current-pw" placeholder="Current password" />
              </div>
              <div class="input-group">
                <input type="password" id="new-pw" placeholder="New password (min 6 chars)" />
              </div>
              <div class="input-group">
                <input type="password" id="confirm-pw" placeholder="Confirm new password" />
              </div>
              <button class="btn btn-primary pill-btn" id="save-password-btn">Update Password</button>
              <div id="settings-pw-msg" class="success-msg hidden"></div>
            </div>
            <button class="btn btn-ghost pill-btn logout-btn" id="logout-btn">Sign Out</button>
          </div>
        </section>

      </div>
    </main>

    <!-- FLOATING ACTION BUTTON -->
    <button class="fab" id="fab-add-task" aria-label="Add Task">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- ── BOTTOM SHEET / MODAL ── -->
  <div id="task-modal" class="bottom-sheet-overlay hidden">
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <h2 id="modal-title">Add Task</h2>
        <button class="btn-icon-soft" id="modal-close-btn" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="task-form" class="sheet-body">
        <input type="hidden" id="task-id" />
        <div class="form-row">
          <div class="input-group">
            <input type="text" id="task-title" placeholder="Task Title" class="large-input" required />
          </div>
        </div>
        <div class="form-row">
          <div class="input-group">
            <textarea id="task-description" rows="2" placeholder="Description (optional)"></textarea>
          </div>
        </div>
        <div class="form-row two-col">
          <div class="input-group">
            <label>Assigned To</label>
            <input type="text" id="task-lead" placeholder="Assignee" list="leads-datalist" autocomplete="off" />
            <datalist id="leads-datalist"></datalist>
          </div>
          <div class="input-group">
            <label>Due Date</label>
            <input type="date" id="task-due" />
          </div>
        </div>
        <div class="form-row two-col">
          <div class="input-group">
            <label>Status</label>
            <select id="task-status" class="styled-select">
              <option value="Not Started">Not Started</option>
              <option value="In Progress">In Progress</option>
              <option value="Done">Done</option>
              <option value="Carried Over">Carried Over</option>
            </select>
          </div>
          <div class="input-group">
            <label>Priority</label>
            <select id="task-priority" class="styled-select">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
          </div>
        </div>
        <div class="input-group hidden" id="week-field-group">
          <label>Add to Week</label>
          <select id="task-week" class="styled-select">
            <option value="current">This Week</option>
            <option value="next">Next Week</option>
          </select>
        </div>
        <div class="sheet-footer">
          <button type="button" class="btn btn-danger pill-btn hidden" id="modal-delete-btn">Delete</button>
          <div class="spacer"></div>
          <button type="submit" class="btn btn-primary pill-btn" id="modal-save-btn">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── CONFIRM MODAL ── -->
  <div id="confirm-modal" class="confirm-overlay hidden">
    <div class="confirm-card">
      <h2 id="confirm-title">Confirm</h2>
      <p id="confirm-message">Are you sure?</p>
      <div class="confirm-actions">
        <button class="btn btn-ghost pill-btn" id="confirm-cancel-btn">Cancel</button>
        <button class="btn btn-primary pill-btn" id="confirm-ok-btn">Confirm</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
